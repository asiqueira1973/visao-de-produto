packages:
  - "apps/*"
  - "packages/*"
  - "tests"
# A CLI do Supabase e o esbuild baixam binários no postinstall; sem isso o
# comando `supabase` não existe e o Vitest não compila.
allowBuilds:
  esbuild: true
  supabase: true
  # Resolvedor nativo do plugin de import do ESLint. Só ferramenta de
  # desenvolvimento; sem o binário, o lint não resolve os caminhos.
  unrs-resolver: true
